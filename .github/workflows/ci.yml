name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # The model-dependent job gates on `github.event_name == 'schedule'`, which could never
  # be true without this: it had been unreachable since the workflow was written.
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The owner role. Migrations and seeding run as this.
  DATABASE_URL: postgresql://echomind:echomind@localhost:5432/echomind
  # The runtime role — CI exercises the same separation a deployment uses, so a missing
  # grant fails here rather than in production.
  APP_DATABASE_URL: postgresql://echomind_app:echomind_app@localhost:5432/echomind
  JWT_SECRET: ci-only-secret-not-the-dev-default-000000
  # Deterministic vectors from scripts/stub_embeddings.py — see the ingest step.
  EMBED_BASE_URL: http://127.0.0.1:8099/v1
  EMBED_MODEL: stub
  # No cross-encoder on a GitHub runner; ordering is not what these tests assert.
  RERANKER: "none"
  PYTHONUNBUFFERED: "1"

jobs:
  # Everything that needs no model. This is the security surface — the SQL validator,
  # the tier matrix, the database grants, the seeded invariants — so it gates every push.
  verify:
    name: Tests (no model required)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: echomind
          POSTGRES_PASSWORD: echomind
          POSTGRES_DB: echomind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U echomind -d echomind"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python and dependencies
        run: |
          uv venv --python 3.12 .venv
          VIRTUAL_ENV=.venv uv pip install -e ".[dev]"

      - name: Migrate and seed
        # scripts.seed applies the migrations and loads the mock dataset. Deliberately
        # not `make seed`, which also embeds the corpus — that happens below against the
        # stub embedder, since a GitHub runner has no GPU.
        run: .venv/bin/python -m scripts.seed

      - name: Start the stub embedder and ingest the corpus
        # The permission filter is enforcement point 3 of spec 05 and had no CI coverage
        # at all, because ingesting needs an embedding model. The isolation tests assert
        # WHO comes back, never how well ranked, so deterministic hashed vectors are
        # enough to exercise the SQL predicate, the visibility rules and the lab scoping.
        # Retrieval quality is measured by `make eval` on a machine with a real model.
        run: |
          .venv/bin/python -m scripts.stub_embeddings &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/health
          .venv/bin/python -m server.rag.ingest db/corpus

      - name: Confirm the app role really is unprivileged
        run: |
          .venv/bin/python - <<'PY'
          from sqlalchemy import text
          from server.config import settings
          from server.db import engine
          assert not settings.runs_as_owner, "CI must exercise the app role, not the owner"
          # The app must be able to work...
          with engine.connect() as c:
              c.execute(text("SELECT count(*) FROM infinity.bookings"))
              c.execute(text("SELECT count(*) FROM reporting.v_billing_lines"))
          # ...and must not be able to reshape the database.
          for ddl in ("CREATE TABLE public.ci_probe (id int)",
                      "DROP TABLE infinity.bookings",
                      "ALTER TABLE infinity.users ADD COLUMN ci_probe int"):
              try:
                  with engine.begin() as c:
                      c.execute(text(ddl))
              except Exception:
                  continue
              raise SystemExit(f"app role was allowed to run DDL: {ddl}")
          print("app role verified: can read and write data, cannot issue DDL")
          PY

      - name: Tests
        # Everything except the three markers that need a served model to mean anything:
        # `gate` and `agent` judge answer quality, and `llm` is the metric-judge suite.
        # Selecting by exclusion rather than by listing markers means a new test is
        # covered by default instead of silently skipped — which is how the approval
        # write path went untested long enough for a missing grant to survive.
        run: .venv/bin/pytest -m "not gate and not agent and not llm" -q

      - name: UI typecheck and build
        working-directory: ui
        run: |
          npm ci || npm install
          npx tsc -b
          npx vite build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .venv && VIRTUAL_ENV=.venv uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check .

  # The model-dependent half. Needs a runner with a served model, so it does not gate
  # a push — it reports. Point ECHOMIND_LLM_BASE_URL at your endpoint in repo settings.
  nightly:
    name: Tests (model required)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .venv && VIRTUAL_ENV=.venv uv pip install -e ".[dev]"
      - run: make up && make seed
      - run: .venv/bin/pytest -q
      - run: make eval
      - run: make demo
